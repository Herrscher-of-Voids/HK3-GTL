// 大数父订单与精确DAG适配的离线边界回归，不替代客户端/CPU验收。
["Hk3ExactPlannerTest", "Hk3ExactOrderTest", "Hk3AeExactPlanAdapterTest", "Hk3ExactBatchPlannerTest", "Hk3ExactOrderDataTest", "Hk3ExactCpuTrackerTest", "Hk3ExactCpuCapacityTest", "Hk3ExactGraphPlannerTest", "Hk3ExactProbabilityLedgerTest", "Hk3ExactProgramTest"].each { entry ->
    tasks.register(entry, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "com.sirin.hk3gtl.common.integration.ae.exact." + entry
        maxHeapSize = "256m"
        systemProperty "file.encoding", "UTF-8"
    }
    tasks.named("check").configure { dependsOn(entry) }
}
tasks.named("check").configure { dependsOn("nativeFarViewTest") }
def hk3PublishedResources = layout.buildDirectory.dir("resources/main")
tasks.named("sourcesJar").configure {
    exclude(hk3InternalResources)
    dependsOn("processResources")
    from(hk3PublishedResources) {
        include("assets/hk3gtl/**", "data/hk3gtl/**")
    }
    eachFile { entry ->
        if ((entry.path.startsWith("assets/hk3gtl/") || entry.path.startsWith("data/hk3gtl/")) &&
                !entry.file.toPath().startsWith(hk3PublishedResources.get().asFile.toPath())) {
            entry.exclude()
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
