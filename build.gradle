plugins {
    id "dev.architectury.loom" version "1.6-SNAPSHOT"
    id "maven-publish"
}

base {
    archivesName = project.archives_base_name
}

version = mod_version
group = project.maven_group

loom {
    silentMojangMappingsLicense()

    forge {
        dataGen {
            mod(mod_id)
        }

        mixinConfig "hk3gtl.mixins.json"
    }

    runConfigs.named("data").configure {
        programArg("--existing=" + file("src/main/resources").absolutePath)
    }

    runConfigs.named("client").configure {
        environmentVariable("MOD_CLASSES", "main%%" + file("build/classes/java/main").absolutePath)
    }

    runConfigs.named("server").configure {
        environmentVariable("MOD_CLASSES", "main%%" + file("build/classes/java/main").absolutePath)
    }
}


repositories {
    mavenLocal()

    flatDir {
        dir "libs"
    }

    mavenCentral()

    maven {
        name = "Quilt"
        url = "https://maven.quiltmc.org/repository/release/"
    }

    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org"
    }

    maven {
        name = "Registrate"
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
            includeGroup("com.jozufozu.flywheel")
            includeGroup("com.simibubi.create")
        }
    }

    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }

    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }

    maven {
        name = "GTCEu Maven"
        url = "https://maven.gtceu.com"
    }

    maven {
        name = "Toma Maven"
        url = "https://maven.toma.dev/releases"
    }

    // ★ KubeJS Maven
    maven {
        url = "https://maven.saps.dev/releases/"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }

    // ★ Ad Astra 相关
    maven {
        url = "https://maven.teamresourceful.com/repository/maven-public/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    mappings loom.layered {
        it.mappings("org.quiltmc:quilt-mappings:${project.minecraft_version}+build.${project.quilt_mappings}:intermediary-v2")
        it.parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_mappings}@zip")
        it.officialMojangMappings { nameSyntheticMembers = false }
    }

    // ── GT CEu 核心 ──
    modImplementation("com.gregtechceu.gtceu:gtceu-${project.minecraft_version}:${project.gtceu_version}") { transitive = false }
    modImplementation("dev:ldlib-forge-${project.minecraft_version}-${project.ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${project.registrate_version}")
    modImplementation("curse.maven:configuration-444699:4608425") { transitive = false }

    // ── GTLCore（前置依赖：磁物质、调律源金等） ──
    modImplementation("dev:gtlcore-1.2.3.3-fix4") { transitive = false }

    // ── GTMThings ──
    modImplementation("dev:gtmthings-1.3.5.b") { transitive = false }

    // ── GTL 模组包特有模组 ──
    modImplementation("dev:gtladditions-3.3") { transitive = false }
    // 内测5更新：使用负责人指定的 GTLsupb 3.5；旧版 3.4.beta.9 只保留在外部实例历史环境，不再作为开发运行依赖。
    modImplementation(files("libs/GTLsupb-3.5.jar"))
    modCompileOnly(files("libs/GTL-Enhancedcore-5.2.6.jar"))
    modCompileOnly(files("libs/embeddium-0.3.31+mc1.20.1.jar"))

    // ── Re-Avaritia + Placebo ──
    modImplementation("dev:Re-Avaritia-forged-1.20.1-1.3.8.3") { transitive = false }
    modImplementation("dev:Placebo-1.20.1-8.6.3") { transitive = false }

    // GTLAdditions 3.3 requires the KFF language provider and bundled Kotlin runtime.
    modRuntimeOnly(files("libs/kotlinforforge-4.11.0-all.jar"))

    // ── Caffeine 缓存库（GTCEu Mixin 依赖） ──
    forgeRuntimeLibrary("com.github.ben-manes.caffeine:caffeine:3.2.1")

    // ── 本地模组依赖 ──
    modImplementation(files("libs/Spear_of_Void-1.3.0fix4.jar"))

    // ── KubeJS + Rhino ──
    modImplementation(files("libs/kubejs-forge-2001.6.5-build.26.jar"))
    modImplementation(files("libs/rhino-forge-2001.2.3-build.10.jar"))

    // 注意：GTLCore 1.2.2.8-fix5 在初始化阶段会硬引用 ftb-ultimine 的类，因此开发环境必须提供该模组（否则直接 NoClassDefFoundError）。
    modRuntimeOnly(files("libs/ftb-library-forge-2001.2.13.jar"))
    modRuntimeOnly(files("libs/ftb-teams-forge-2001.3.2.jar"))
    // FTB API 仅用于编译。
    modCompileOnly(files("libs/ftb-teams-forge-2001.3.2.jar", "libs/ftb-library-forge-2001.2.13.jar"))
    modRuntimeOnly(files("libs/ftb-ultimine-forge-2001.1.8.jar"))
    // 注意：GTMThings 的部分 mixin 会引用 FTBChunks API 元数据，未加载 ftb-chunks 时会在类转换阶段直接崩溃。
    modRuntimeOnly(files("libs/ftb-chunks-forge-2001.3.8.jar"))
    modRuntimeOnly(files("libs/ftb-xmod-compat-forge-2.1.3.jar"))
    // FTB Quests 任务数据与进度投影。
    modRuntimeOnly(files("libs/ftb-quests-forge-2001.4.22.jar"))
    // 按本地 FTB 接口编译任务进度投影。
    modCompileOnly(files("libs/ftb-quests-forge-2001.4.22.jar"))

    // ── Architectury API ──
    modImplementation("dev.architectury:architectury-forge:${project.architectury_version}")

    // ── AE2 + GuideMe ──
    modImplementation("curse.maven:applied-energistics-2-223794:7148487") { transitive = false }
    modImplementation("curse.maven:guideme-1173950:7127447") { transitive = false }
    modCompileOnly(files("libs/ae2ct-1.20.1-1.1.1.jar"))

    // ── Stargate Journey ──
    modImplementation(files("libs/[星门之旅] Stargate Journey-1.20.1-0.6.44.jar"))

    // ── Extended AE + Glodium ──
    modImplementation("dev:ExtendedAE-1.20-1.4.19-forge") { transitive = false }
    modImplementation("curse.maven:glodium-957920:5006780")

    // ── Ad Astra 相关 ──
    forgeRuntimeLibrary("com.teamresourceful:yabn:1.0.3")
    forgeRuntimeLibrary("com.teamresourceful:bytecodecs:1.0.2")
    modImplementation("com.teamresourceful.resourcefullib:resourcefullib-forge-${project.minecraft_version}:${project.resourcefullib_version}")
    modImplementation("com.teamresourceful.resourcefulconfig:resourcefulconfig-forge-${project.minecraft_version}:${project.resourcefulconfig_version}")
    modImplementation("earth.terrarium.botarium:botarium-forge-${project.minecraft_version}:${project.botarium_version}")
    modImplementation("earth.terrarium.adastra:ad_astra-forge-${project.minecraft_version}:${project.ad_astra_version}") { transitive false }

    // ── JEI ──
    modCompileOnly("mezz.jei:jei-${project.minecraft_version}-forge-api:${project.jei_version}") { transitive = false }
    modCompileOnly("mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}") { transitive = false }
    modImplementation("mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}") { transitive = false }

    // ── JEI Integration（JEI 补充 tooltip 等；仅运行时，无需编译进 hk3gtl）──
    modRuntimeOnly("curse.maven:jei-integration-265917:${project.jei_integration_curse_file}") { transitive = false }

    // ── Jade（WTHIT 类信息显示模组）──
    // 对应原Jade依赖更新至实例11.13.3；旧配置保留于archive。 / Match the existing Jade dependency to the instance.
    modCompileOnly(files("libs/Jade-1.20.1-Forge-11.13.3.jar"))
    modRuntimeOnly(files("libs/Jade-1.20.1-Forge-11.13.3.jar"))

    // ── WMP（可选联动：电路板驱动西瓜发电机 GT 模式）──
    modCompileOnly(files("libs/wmp-1.7.0.jar"))
    modRuntimeOnly(files("libs/wmp-1.7.0.jar"))

    // ── Mixin Extras ──
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"))
    implementation(include("org.tukaani:xz:1.10"))

    // ── Lombok ──
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.register("extractCgseCompileJar", Copy) {
    from(zipTree("libs/gtlcore-1.2.3.3-fix4.jar")) {
        include("META-INF/jars/cgse-engine-0.3.3.jar")
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into(layout.buildDirectory.dir("generated/compile-deps"))
}
tasks.named("compileJava").configure {
    dependsOn("extractCgseCompileJar")
    doFirst { classpath = classpath.plus(files(layout.buildDirectory.file("generated/compile-deps/cgse-engine-0.3.3.jar"))) }
}

def hk3ModsTomlProps = [
        "mod_license"      : mod_license,
        "mod_id"           : mod_id,
        "version"          : version,
        "mod_name"         : mod_name,
        "mod_authors"      : mod_authors,
        "mod_description"  : mod_description,
        "forge_version"    : forge_version,
        "minecraft_version": minecraft_version,
        "gtceu_version"    : gtceu_version,
        "ldlib_version"    : ldlib_version,
        "registrate_version": registrate_version,
        "jei_version"             : jei_version,
        "jei_integration_version" : jei_integration_version,
        "kubejs_version"   : kubejs_version,
        "ad_astra_version" : ad_astra_version,
]

def hk3SourceBlueprintManifest = file("source_archives/approved_architecture/manifest.json")
tasks.register("hk3gtlRestoreSourceBlueprints", Exec) {
    group = "build setup"
    description = "校验并恢复源码蓝图归档，不覆盖本地修改"
    inputs.files(file("tools/restore_source_blueprints.py"),
            fileTree("source_archives/approved_architecture") {
                include("manifest.json", "*.json.gz")
            })
    outputs.files(provider {
        if (!hk3SourceBlueprintManifest.isFile()) return []
        def manifest = new groovy.json.JsonSlurper().parse(hk3SourceBlueprintManifest)
        manifest.files.collect { file(it.path) }
    })
    onlyIf { hk3SourceBlueprintManifest.isFile() }
    commandLine("python", "tools/restore_source_blueprints.py")
}

tasks.register("hk3gtlCompactStructures", Exec) {
    dependsOn("hk3gtlRestoreSourceBlueprints")
    inputs.files(fileTree("src/main/resources/data/hk3gtl/approved_architecture"),
            fileTree("src/main/resources/data/hk3gtl/structures/approved"),
            fileTree("src/main/resources/data/hk3gtl/structures/approved_preview"),
            fileTree("src/main/resources/data/hk3gtl/structures/compact"),
            file("tools/structure_delivery/compact_runtime_structures.py"),
            file("tools/structure_delivery/build_late_approved_resources_20261026.py"))
    outputs.dir(layout.buildDirectory.dir("generated/compactResources"))
    environment("HK3GTL_COMPACT_OUTPUT", layout.buildDirectory.dir("generated/compactResources/data/hk3gtl").get().asFile.absolutePath)
    environment("HK3GTL_COMPACT_LOG", layout.buildDirectory.dir("reports/compact-structures").get().asFile.absolutePath)
    commandLine("python", "tools/structure_delivery/compact_runtime_structures.py")
}

def hk3InternalResources = ["assets/hk3gtl/provenance/**", "data/hk3gtl_r110_test/**",
        "data/hk3gtl/research_registry/**", "data/hk3gtl/stage_registry/**",
        "data/hk3gtl/structures/w*_approved.json"]
def hk3XzGeometry = providers.gradleProperty("hk3XzGeometry").map { it.toBoolean() }.orElse(false)
processResources {
    inputs.property("hk3XzGeometry", hk3XzGeometry)
    exclude(hk3InternalResources)
    dependsOn("hk3gtlCompactStructures")
    doFirst {
        delete(destinationDir)
    }
    from(layout.buildDirectory.dir("generated/compactResources"))
    exclude("data/hk3gtl/approved_architecture/**", "data/hk3gtl/structures/approved/*.nbt",
            "data/hk3gtl/structures/approved_preview/**")
    inputs.properties(hk3ModsTomlProps)
    inputs.files("tools/optimize_runtime_textures.py", "tools/sanitize_release_resources.py")
    inputs.files("tools/compact_runtime_blueprints.py", "tools/compact_runtime_scenes.py", "tools/compress_runtime_geometry.py")
    inputs.files("tools/hollow_runtime_structures.py", "tools/structure_delivery/hollow_blueprint.py",
            "tools/structure_delivery/hollow_scene_resources.py")
    inputs.files("tools/generate_multiblock_pattern_library.py",
            "src/main/java/com/sirin/hk3gtl/common/machine/wonder/Hk3WonderCatalog.java")
    filteringCharset = "UTF-8"

    filesMatching("META-INF/mods.toml") {
        expand hk3ModsTomlProps
    }

    exclude("META-INF/mods.toml")
    doLast {
        exec {
            commandLine("python", "tools/hollow_runtime_structures.py", destinationDir.absolutePath,
                    layout.buildDirectory.file("reports/runtime-hollow-structures.json").get().asFile.absolutePath)
        }
        exec {
            commandLine("python", "tools/generate_multiblock_pattern_library.py", destinationDir.absolutePath)
        }
        exec {
            commandLine("python", "tools/optimize_runtime_textures.py", destinationDir.absolutePath,
                    layout.buildDirectory.file("reports/runtime-textures.json").get().asFile.absolutePath)
        }
        exec {
            commandLine("python", "tools/compact_runtime_blueprints.py", destinationDir.absolutePath,
                    layout.buildDirectory.file("reports/runtime-blueprints.json").get().asFile.absolutePath)
        }
        exec {
            commandLine("python", "tools/compact_runtime_scenes.py", destinationDir.absolutePath,
                    layout.buildDirectory.file("reports/runtime-scenes.json").get().asFile.absolutePath)
        }
        exec {
            commandLine("python", "tools/sanitize_release_resources.py", destinationDir.absolutePath)
        }
        if (hk3XzGeometry.get()) {
            exec {
                commandLine("python", "tools/compress_runtime_geometry.py", destinationDir.absolutePath)
            }
        }
    }
}

// Independent tests may read reviewed originals; neither development runtime nor JAR copies them.
sourceSets.test.runtimeClasspath += files("src/main/resources")

tasks.register("hk3gtlWriteModsTomlToClasses", Copy) {
    // 必须把展开属性登记为任务输入：否则改 gradle.properties 版本号后任务被判 UP-TO-DATE，
    // jar 内 mods.toml 会残留旧版本号（欢迎自检页版本与说明取自运行时 mods.toml）
    inputs.properties(hk3ModsTomlProps)
    filteringCharset = "UTF-8"
    from("src/main/resources/META-INF/mods.toml")
    into(layout.buildDirectory.dir("classes/java/main/META-INF"))
    expand hk3ModsTomlProps
    doFirst {
        // Copy 的增量输出可能保留旧文件，写入前删除以保证版本范围与源码一致。
        file("${layout.buildDirectory.get()}/classes/java/main/META-INF/mods.toml").delete()
    }
}

tasks.register("hk3gtlSyncDevResourcesToClasses", Copy) {
    dependsOn("processResources")
    doFirst {
        delete(new File(destinationDir, "assets"), new File(destinationDir, "data"))
    }
    from(layout.buildDirectory.dir("resources/main")) {
        // mods.toml 由专用任务展开，禁止旧资源副本并发覆盖锁定后的版本范围。
        exclude("META-INF/mods.toml")
    }
    into(layout.buildDirectory.dir("classes/java/main"))
}

tasks.named("classes").configure {
    dependsOn("hk3gtlWriteModsTomlToClasses")
    dependsOn("hk3gtlSyncDevResourcesToClasses")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(AbstractCopyTask).configureEach {
    filteringCharset = "UTF-8"
}

tasks.named("remapJar").configure {
    inputs.file("tools/audit_release_jar.py")
    inputs.files(fileTree("src/main/resources/data/hk3gtl/structures") {
        include("w*_approved.json", "approved/*.json")
    }, file("src/main/resources/data/hk3gtl/catalog/world_bubble_resources.json"))
    doLast {
        exec {
            commandLine("python", "tools/audit_release_jar.py", archiveFile.get().asFile.absolutePath,
                    file("src/main/resources").absolutePath)
        }
    }
}

tasks.register("renameToChinese") {
    dependsOn("remapJar")
    doLast {
        def buildLibs = layout.buildDirectory.dir("libs").get().asFile
        def base = project.archives_base_name as String
        def ver = project.mod_version as String
        def jar = new File(buildLibs, "${base}-${ver}.jar")
        if (!jar.exists()) {
            jar = new File(buildLibs, "${base}.jar")
        }
        def target = new File(buildLibs, "${project.mod_name}.jar")
        if (!jar.exists()) {
            throw new GradleException("未找到 remapJar 产物: ${buildLibs.absolutePath}")
        }
        java.nio.file.Files.copy(jar.toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        println "发布包: ${target.absolutePath}"
    }
}

tasks.named("build").configure {
    finalizedBy("renameToChinese")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Reviewed originals remain in the workspace; production uses one lossless stream per structure.
    exclude("data/hk3gtl/approved_architecture/**", "data/hk3gtl/structures/approved/*.nbt",
            "data/hk3gtl/structures/approved_preview/**")
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_authors
        ])
    }
}

