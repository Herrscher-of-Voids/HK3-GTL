# GTLAdditions：多方块 Pattern 硬引用 gtladditions:spatially_transcendent_gravitational_lens
# 及 Hyperion 结构方块，缺失时结构解析会抛 IllegalStateException，故声明为硬依赖。
[[dependencies."hk3gtl"]]
modId = "gtladditions"
mandatory = true
versionRange = "[2.6.5,)"
ordering = "AFTER"
side = "BOTH"

# Avaritia（Re-Avaritia）：客户端 Mixin/Invoker 直接链接 Avaritia Shader API，
# 缺失时客户端存在目标类加载风险，故声明为硬依赖。
[[dependencies."hk3gtl"]]
modId = "avaritia"
mandatory = true
versionRange = "[1.3.8,)"
ordering = "AFTER"
side = "BOTH"

