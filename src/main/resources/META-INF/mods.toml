modLoader = "javafml"
loaderVersion = "[47,)"
license = "All Rights Reserved"

[[mixins]]
config = "hk3gtl.mixins.json"

[[mods]]
modId = "hk3gtl"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

